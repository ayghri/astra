defaults:
  - paths
  - _self_

dataset:
  name: imagenet100
  num_classes: 100
  data_dir: ${paths.imagenet100}

model:
  name: resnet18
  depth: 18
  widen_factor: 1
  drop_rate: 0.0

sparsity: 0.9
dense_alloc: 0.1

training:
  epochs: 100
  batch_size: 256
  seed: 42
  num_workers: 8

optimizer:
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-4

rigl:
  const_fan_in: true
  dynamic_ablation: true
  delta: 100
  sparsity_distribution: erk
  min_salient_weights_per_neuron: 0.3
  use_sparse_init: true
  init_method_str: grad_flow_init
  use_sparse_const_fan_in_for_ablation: true

device: cuda:0
output_dir: autoresearch/results

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
