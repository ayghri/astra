[tool.poetry]
name = "astra"
version = "0.1.0"
description = "Adaptive Soft-Thresholding Algorithm"
authors = ["Ayoub Ghriss research@ayghri.me"]
readme = "README.md"
packages = [{ include = "astra", from = "./" }]


[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = ">=2.9.1,<3.0.0"
accelerate = { version = ">=1.12.0,<2.0.0", optional = true }
datasets = { version = ">=4.4.1,<5.0.0", optional = true }
hydra-core = { version = ">=1.3.2,<2.0.0", optional = true }
lm-eval = { version = ">=0.4.9.2,<0.5.0.0", optional = true }
matplotlib = { version = ">=3.10.7,<4.0.0", optional = true }
torchvision = { version = ">=0.24.1,<0.25.0", optional = true }
transformers = "^5.5.0"
wandb = { version = ">=0.23.1,<0.24.0", optional = true }

[tool.poetry.extras]
experiments = [
  "matplotlib",
  "lm-eval",
  "torchvision",
  "transformers",
  "datasets",
  "wandb",
  "hydra-core",
]


[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
ipywidgets = "^8.1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
