data: /media/data/datasets/imagenet_ffcv    # point at .beton dir for ffcv; use imagenet for dali/tv
output: checkpoints/resnet50_imagenet  # relative to original working dir

training:
  epochs: 90
  batch_size: 256                      # per GPU
  warmup_epochs: 5
  seed: 42
  print_freq: 100
  resume: ""
  loader: ffcv                         # ffcv | dali | tv

optimizer:
  lr: 0.1                              # scaled by (world_size * batch_size / 256)
  momentum: 0.9
  weight_decay: 1.0e-4

workers: 8                             # data loader workers per GPU

aug:
  randaug_ops: 2
  randaug_magnitude: 9
  erasing_prob: 0.25
  mixup_alpha: 0.2
  cutmix_alpha: 1.0

wandb:
  project: bonsainet
  entity: null
  mode: online                         # online | offline | disabled
  group: resnet50_imagenet

hydra:
  run:
    dir: .                             # keep original CWD; avoids per-process dir conflicts
  output_subdir: null                  # don't write .hydra/ subdirectory
