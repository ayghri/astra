data: /media/data/datasets/imagenet_ffcv  # FFCV: dir with train.beton/val.beton
output: checkpoints/resnet50_imagenet

training:
  epochs: 90
  batch_size: 256
  warmup_epochs: 5
  seed: 42
  print_freq: 100
  resume: ""
  loader: ffcv             # ffcv | tv

optimizer:
  lr: 0.1                 # scaled by (world_size * batch_size / 256)
  momentum: 0.9
  weight_decay: 1.0e-4

workers: 8

aug:
  randaug_ops: 2
  randaug_magnitude: 9
  erasing_prob: 0.25
  mixup_alpha: 0.2
  cutmix_alpha: 1.0

wandb:
  project: astra-imagenet
  entity: null
  mode: disabled
  group: resnet50_imagenet

hydra:
  run:
    dir: .
  output_subdir: null
