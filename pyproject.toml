[tool.poetry]
name = "astra"
version = "0.1.0"
description = "Adaptive Soft-Thresholding Algorithm"
authors = ["Ayoub Ghriss research@ayghri.me"]
readme = "README.md"
packages = [{ include = "astra", from = "./" }]


[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = ">=2.10.0,<3.0.0"
transformers = "^5.5.0"
sparsekit = "^0.1.2"
hydra-core = ">=1.3.2,<2.0.0"
datasets = ">=4.4.1,<5.0.0"
wandb = ">=0.23.1,<0.24.0"
lm-eval = ">=0.4.9.2,<0.5.0.0"
accelerate = ">=1.12.0,<2.0.0"
timm = ">=1.0.0"
ffcv = { version = ">=1.0.0", optional = true }
matplotlib = { version = ">=3.10.7,<4.0.0", optional = true }

[tool.poetry.extras]
plotting = ["matplotlib"]
imagenet = ["ffcv"]


[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
ipywidgets = "^8.1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
