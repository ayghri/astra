model: Qwen/Qwen3-1.7B
method: admm  # sparsegpt | admm | admm_corr | wanda
device: cuda:0
fp16: false
admm_iter: 1000
percdamp: 0.01
num_samples: 256
seq_len: 2048
seed: 42
eval_tasks: "wikitext"
output_dir: autoresearch/results

hydra:
  run:
    dir: ${output_dir}/${now:%Y%m%d_%H%M}_${method}
  sweep:
    dir: ${output_dir}/sweep_${now:%Y%m%d_%H%M}
    subdir: ${method}
