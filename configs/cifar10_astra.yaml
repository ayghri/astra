dataset:
  name: cifar10
  num_classes: 10
  data_dir: /buckets/datasets/torchvision

model:
  depth: 22
  widen_factor: 2
  drop_rate: 0.3

sparsity: 0.9          # override: sparsity=0.8 | 0.9 | 0.95
sparsity_type: unstructured   # unstructured | fanin | channel

training:
  epochs: 200
  batch_size: 192
  warmup_epochs: 8
  freeze_epoch: 150
  seed: 42
  num_workers: 4
  checkpoint_dir: checkpoints/cifar10_astra

optimizer:
  lr: 0.0125
  momentum: 0.9437
  weight_decay: 6.1e-4
  nesterov: false
  min_lr: 0.0

astra:
  alpha: 0.1
  beta: 0.01          # lambda EMA decay
  ema_rho: 0.018      # gradient EMA decay
  lambda_max: 0.0015  # cap on lambda

wandb:
  project: astra-cifar
  entity: null
  mode: online
  group: cifar10_astra

hydra:
  run:
    dir: .
  output_subdir: null
