defaults:
  - paths
  - _self_

method: imp

dataset:
  name: imagenet100
  num_classes: 100
  data_dir: ${paths.imagenet100}

model:
  name: resnet18
  depth: 18
  widen_factor: 1
  drop_rate: 0.0

sparsity: 0.9
sparsity_type: unstructured
sparsity_dist: uniform

training:
  epochs: 50
  batch_size: 256
  seed: 42
  num_workers: 8

pruning:
  rounds: 10
  prune_rate: 0.2
  rewind: true
  rewind_epoch: 0

optimizer:
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-4

output_dir: autoresearch/results

wandb:
  project: astra-imagenet100
  entity: null
  mode: disabled

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
