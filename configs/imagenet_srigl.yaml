dataset:
  name: imagenet
  num_classes: 1000
  data_dir: /buckets/datasets/imagenet

model:
  name: resnet50
  depth: 50              # unused for resnet50 (timm handles it)
  widen_factor: 1
  drop_rate: 0.0

sparsity: 0.9
dense_alloc: 0.1

training:
  epochs: 100
  batch_size: 256
  seed: 42
  num_workers: 8

optimizer:
  lr: 0.1               # scaled by world_size * batch_size / 256
  momentum: 0.9
  weight_decay: 1.0e-4

rigl:
  const_fan_in: true
  dynamic_ablation: true
  delta: 800             # 4096 * 100 / 512 from paper
  sparsity_distribution: erk
  min_salient_weights_per_neuron: 0.3
  use_sparse_init: true
  init_method_str: grad_flow_init
  use_sparse_const_fan_in_for_ablation: true

device: cuda:0
output_dir: autoresearch/results

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
